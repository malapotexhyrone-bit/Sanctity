<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SANCTITY — Project Dignidad</title>


  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared.css"/>

  <style>
    body { margin: 0; }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 24px;
      background: radial-gradient(circle at top, #122111 0%, #0a120a 52%, #070a06 100%);
      color: #f4f5ef;
    }

    .presents {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 22px;
    }

    .main-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(76px, 18vw, 160px);
      letter-spacing: 6px;
      color: #7dc87d;
      line-height: 0.9;
      margin-bottom: 34px;
    }

    .start-btn {
      display: inline-block;
      margin-top: 16px;
    }

    .start-btn.button-solid {
      background: #f4f4ee;
      color: #1a3a1a;
      border-color: #f4f4ee;
      padding: 18px 56px;
      font-size: 14px;
    }

    .start-btn.button-solid:hover {
      background: #7dc87d;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <p class="presents">PROJECT DIGNIDAD<br>PRESENTS</p>
    <h1 class="main-title">SANCTITY</h1>
    <a class="start-btn button-solid" href="home.html">START</a>
  </div>
</body>
</html>
